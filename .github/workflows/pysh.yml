name: Build Pysh

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          pip install --upgrade pyinstaller termcolor pygments

      - name: Build pysh
        run: |
          pyinstaller pysh.spec
      - name: Build updater
        run: |
          cd update
          pyinstaller --onefile updater.py --name pyshupdate

      - uses: actions/upload-artifact@v4
        with:
          name: Pysh-${{ runner.os }}
          path: |
            dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Installer-${{ runner.os }}
          path: |
            update/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Pysh-Bundle-${{ runner.os }}
          path: |
            dist/*
            update/dist/*
