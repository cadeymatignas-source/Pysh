name: Build Pysh

on: push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          pip install --upgrade pyinstaller termcolor pygments

      - name: Build pysh windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller pysh.spec
      - name: Build pysh macos
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --icon=logo.png pysh.py
      - name: Build pysh linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --icon=logo.png pysh.py
      - name: Build updater
        run: |
          cd update
          pyinstaller pyshupdate.spec
      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: Pysh-${{ runner.os }}
          path: |
            dist/*
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Installer-${{ runner.os }}
          path: |
            update/dist/*
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Pysh-Bundle-${{ runner.os }}
          path: |
            dist/*
            update/dist/*
